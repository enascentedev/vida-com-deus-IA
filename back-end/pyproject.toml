[project]
name = "vida-com-deus-backend"
version = "0.1.0"
description = "Back-end da aplicação Vida com Deus — FastAPI monolito modular"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.5.0",
    "openai>=2.21.0",
    "beautifulsoup4>=4.14.3",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "passlib[argon2]>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: teste que exige PostgreSQL (TEST_DATABASE_URL). Pulado sem banco; obrigatório quando REQUIRE_DB=1.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# B008 é falso positivo com FastAPI: `Depends(...)` em default de parâmetro é o
# mecanismo oficial de injeção de dependência do framework.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "migrations/versions"

# Tipagem estrita nos módulos desta tarefa (autenticação, autorização e
# persistência de sessão). Os demais domínios ficaram fora do escopo da
# TASK-03 e seguem no modo permissivo — nenhuma regra existente foi afrouxada.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = [
    "app.core.*",
    "app.services.auth_service",
    "app.repositories.user_repository",
    "app.domain.auth.*",
    "app.integrations.*",
]
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
